[project]
name = "job-crawler"
version = "0.1.0"
description = "Job application crawler"
requires-python = ">=3.11"
dependencies = [
  "botasaurus",
  "litellm",
  "pydantic",
  "requests",
  "python-dotenv",
  "beautifulsoup4",
  "pypdf>=6.14.2",
  "python-docx>=1.2.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.job_crawler]
max_results = 5
min_score = 70
max_queries_per_iteration = 4

[tool.job_crawler.budget]
max_llm_calls = 40
max_search_iterations = 8

[tool.job_crawler.output]
results_json = "data/results.json"
results_csv = "data/results.csv"
cache_path = "data/cache.json"
memory_path = "data/memory.json"

[tool.job_crawler.agent]
enable_planning = true
enable_reflection = true
ats_query_boost = true
company_query_boost = true
exclude_aggregator_sites = true

[tool.job_crawler.llm]
model = "openrouter/openrouter/free"
temperature = 0.2
max_retries = 3
min_delay_seconds = 1

[tool.job_crawler.notify]
telegram = true

[tool.job_crawler.bot]
poll_timeout_seconds = 50
# Scan each active user once per day, the first time local time in
# scan_timezone passes scan_hour (0-23). Override per-deployment with
# JOB_CRAWLER_SCAN_HOUR / JOB_CRAWLER_SCAN_TIMEZONE.
scan_hour = 7
scan_timezone = "UTC"
intake_max_llm_calls = 6

[tool.job_crawler.dashboard]
enabled = true
host = "127.0.0.1"  # no auth: bind loopback; Docker sets JOB_CRAWLER_DASHBOARD_HOST=0.0.0.0
port = 8765

[tool.job_crawler.search]
brave_endpoint = "https://api.search.brave.com/res/v1/web/search"
results_per_query = 20
request_timeout_seconds = 30
min_delay_seconds = 1
browser_fallback = true
freshness = "pm"
min_job_text_chars = 800
max_harvest_links = 5

[tool.job_crawler.profiles.minimal]
max_results = 2
min_score = 60

[tool.job_crawler.profiles.minimal.budget]
max_llm_calls = 6
max_search_iterations = 2

[tool.job_crawler.profiles.minimal.output]
results_json = "data/results_minimal.json"
results_csv = "data/results_minimal.csv"
cache_path = "data/cache_minimal.json"

[tool.job_crawler.profiles.minimal.llm]
model = "openrouter/openrouter/free"
temperature = 0.2
max_retries = 2
min_delay_seconds = 1

[tool.job_crawler.profiles.minimal.search]
brave_endpoint = "https://api.search.brave.com/res/v1/web/search"
results_per_query = 3
request_timeout_seconds = 20
min_delay_seconds = 2
