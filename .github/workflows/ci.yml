name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tests/test_rebaseline.py replays the corpus against the arming
          # revision pinned in evals/baseline.json, so the history that holds
          # that commit has to be here. A shallow clone skips those tests.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -q

      - name: Run mock test
        run: uv run python run_mock_test.py
